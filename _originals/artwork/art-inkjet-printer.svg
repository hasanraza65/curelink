<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000">
  <defs>
    <linearGradient id="bodyTop" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eff4"/>
    </linearGradient>
    <linearGradient id="bodyFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fa"/>
      <stop offset="0.5" stop-color="#e4ecf2"/>
      <stop offset="1" stop-color="#cfdae3"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d6e0"/>
      <stop offset="1" stop-color="#aebfcc"/>
    </linearGradient>
    <linearGradient id="baseDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38495a"/>
      <stop offset="1" stop-color="#22303d"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2733"/>
      <stop offset="1" stop-color="#33434f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="trayG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2eaf0"/>
      <stop offset="1" stop-color="#c4d2dd"/>
    </linearGradient>
    <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d2233" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#0d2233" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#0d2233" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="600" cy="880" rx="360" ry="48" fill="url(#sh)"/>

  <!-- sheet emerging from the rear feed -->
  <g transform="rotate(-2 600 300)">
    <path d="M392 92 L806 92 L820 340 L378 340 Z" fill="url(#paper)" stroke="#d3e0e9" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#c2d3de" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M436 150 L742 150"/><path d="M436 186 L700 186"/>
      <path d="M436 222 L756 222"/><path d="M436 258 L648 258"/>
    </g>
    <path d="M436 294 L560 294" stroke="#1B7FC4" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- rear paper support -->
  <path d="M352 356 L848 356 L836 402 L364 402 Z" fill="url(#bodySide)" stroke="#9db1c0" stroke-width="2" stroke-linejoin="round"/>

  <!-- upper shell -->
  <path d="M300 402 L900 402 L916 470 L284 470 Z" fill="url(#bodyTop)" stroke="#c3d2dd" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- rear feed slot -->
  <path d="M356 402 L844 402 L838 424 L362 424 Z" fill="url(#slot)"/>

  <!-- main body front -->
  <path d="M284 470 L916 470 L916 700 L284 700 Z" fill="url(#bodyFront)" stroke="#bccbd7" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- control panel strip -->
  <rect x="284" y="470" width="632" height="52" fill="#eaf1f6"/>
  <rect x="640" y="484" width="238" height="26" rx="13" fill="#dbe6ee"/>
  <circle cx="332" cy="497" r="13" fill="#00A651"/>
  <circle cx="332" cy="497" r="6" fill="#7ce2ae" opacity="0.9"/>
  <circle cx="380" cy="497" r="10" fill="#1B7FC4"/>
  <circle cx="422" cy="497" r="10" fill="#c3d2dd"/>
  <circle cx="464" cy="497" r="10" fill="#c3d2dd"/>

  <!-- output slot -->
  <path d="M330 560 L870 560 L870 604 L330 604 Z" fill="url(#slot)"/>
  <!-- printed sheet in the output tray -->
  <path d="M300 604 L900 604 L946 742 L254 742 Z" fill="url(#trayG)" stroke="#adbecb" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M372 604 L828 604 L856 700 L344 700 Z" fill="url(#paper)" stroke="#d3e0e9" stroke-width="2"/>
  <g stroke="#cbdae4" stroke-width="4.5" stroke-linecap="round">
    <path d="M414 640 L742 640"/><path d="M414 668 L688 668"/>
  </g>

  <!-- base / feet -->
  <path d="M254 742 L946 742 L946 792 L254 792 Z" fill="url(#baseDark)"/>
  <rect x="296" y="792" width="86" height="20" rx="9" fill="#1a2530"/>
  <rect x="818" y="792" width="86" height="20" rx="9" fill="#1a2530"/>

  <!-- brand accent rule -->
  <rect x="254" y="742" width="692" height="7" fill="#0A5B96" opacity="0.85"/>

  <!-- soft top highlight -->
  <path d="M300 404 L898 404" stroke="#ffffff" stroke-width="4" opacity="0.95"/>
</svg>
